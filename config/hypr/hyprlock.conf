background {
    monitor =
    path = /home/shaheer/Pictures/Wallpapers/current.jpg
    blur_passes = 4
    blur_size = 10
    noise = 0.012
    contrast = 0.85
    brightness = 0.65
    vibrancy = 0.30
    vibrancy_darkness = 0.6
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.30
    dots_spacing = 0.18
    dots_center = true
    outer_color = rgba(b4befeFF)
    inner_color = rgba(1e1e2eff)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    placeholder_text = <span foreground="#a6adc8">Password...</span>
    hide_input = false
    rounding = 14
    position = 0, -140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M")"
    color = rgba(cba6f7ff)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%p")"
    color = rgba(a6adc8ff)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(a6e3a1ff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 10
    halign = center
    valign = center
}
