.tl-line{position:relative}
.tl-line::before{content:'';position:absolute;left:4px;top:16px;bottom:-8px;width:2px;background:linear-gradient(180deg,var(--border),transparent)}
.tl-item:last-child .tl-line::before{display:none}
.bk-card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--r);padding:.75rem;margin-bottom:.5rem;display:flex;align-items:center;gap:.75rem;transition:all .3s}
.bk-card:hover{border-color:rgba(0,243,255,.3);background:rgba(0,243,255,.05);transform:translateX(3px)}
.lp-card{background:var(--glass-bg);border:1px solid var(--border);border-radius:var(--r);padding:1rem;margin-bottom:.75rem;transition:all .4s cubic-bezier(.25,.46,.45,.94);position:relative;overflow:hidden}
.lp-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--purple));opacity:0;transition:opacity .4s}
.lp-card:hover{border-color:rgba(0,243,255,.3);box-shadow:0 4px 30px rgba(0,243,255,.08);transform:translateY(-2px)}
.lp-card:hover::before{opacity:1}
.lp-phase{background:rgba(0,243,255,.06);border:1px solid rgba(0,243,255,.12);border-radius:8px;padding:.6rem .75rem;margin:.4rem 0;transition:all .3s}
.lp-phase:hover{background:rgba(0,243,255,.1);border-color:rgba(0,243,255,.2)}
.lp-phase-title{font-family:var(--d);font-size:.65rem;font-weight:700;color:var(--cyan);letter-spacing:1px;margin-bottom:.3rem}
.lp-resource{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .5rem;background:rgba(255,0,127,.08);border:1px solid rgba(255,0,127,.15);border-radius:6px;font-size:.65rem;color:var(--pink);margin:.15rem .2rem .15rem 0;transition:all .2s;text-decoration:none}
.lp-resource:hover{background:rgba(255,0,127,.15);border-color:rgba(255,0,127,.3);transform:translateY(-1px)}
.lp-project{display:flex;align-items:center;gap:.4rem;padding:.35rem .6rem;background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.12);border-radius:6px;font-size:.65rem;color:var(--green);margin:.2rem 0;transition:all .2s}
.lp-project:hover{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.25);transform:translateX(3px)}
.conv-card{background:var(--glass-bg);border:1px solid var(--border);border-radius:var(--r);padding:.75rem 1rem;margin-bottom:.5rem;transition:all .3s}
.conv-card:hover{border-color:rgba(0,243,255,.3);transform:translateX(3px)}
.stagger-in>*{opacity:0;transform:translateY(12px);animation:staggerFade .4s cubic-bezier(.25,.46,.45,.94) forwards}
.stagger-in>*:nth-child(1){animation-delay:.05s}.stagger-in>*:nth-child(2){animation-delay:.1s}.stagger-in>*:nth-child(3){animation-delay:.15s}.stagger-in>*:nth-child(4){animation-delay:.2s}.stagger-in>*:nth-child(5){animation-delay:.25s}.stagger-in>*:nth-child(6){animation-delay:.3s}.stagger-in>*:nth-child(7){animation-delay:.35s}.stagger-in>*:nth-child(8){animation-delay:.4s}.stagger-in>*:nth-child(9){animation-delay:.45s}.stagger-in>*:nth-child(10){animation-delay:.5s}
@keyframes staggerFade{to{opacity:1;transform:translateY(0)}}
.glow-line{height:2px;background:linear-gradient(90deg,transparent,var(--cyan),var(--pink),var(--purple),transparent);margin-bottom:1rem;border-radius:1px;animation:glowPulse 3s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:.5;filter:blur(0px)}50%{opacity:1;filter:blur(1px)}}
@media(max-width:768px){.app{grid-template-columns:1fr}.sidebar{display:none;position:fixed;top:56px;left:0;right:0;bottom:0;z-index:90;max-width:240px;transform:translateX(-100%);transition:transform .3s cubic-bezier(.25,.46,.45,.94)}.sidebar.open{display:block;transform:translateX(0)}.hamburger{display:block}.search input{width:140px}.search input:focus{width:200px}}
</style>
</head>
<body>
<div id="parallax-bg"><div class="ambient-orb orb-cyan" data-speed="0.02"></div><div class="ambient-orb orb-pink" data-speed="0.03"></div><div class="ambient-orb orb-purple" data-speed="0.015"></div></div>
<div class="scanlines"></div><div class="noise-overlay"></div>
<div class="app">
<header class="topbar"><div style="display:flex;align-items:center;gap:.5rem"><button class="hamburger" id="ham" onclick="toggleSidebar()">☰</button><div class="logo"><div class="logo-icon">⚡</div><div><div class="logo-text">CYBER-HUB</div></div></div><div class="health-dot loading" id="healthDot" title="Checking vault health..."></div></div><div style="display:flex;align-items:center;gap:.75rem"><div class="search"><input id="gs" placeholder="Search vaults..." autocomplete="off" spellcheck="false"><div class="sr" id="gr"></div></div><div class="clock" id="clk"></div></div></header>
<nav class="sidebar" id="nav"></nav>
<main class="main" id="mc"></main>
</div>
<div class="mo" id="mov"><div class="mm" id="mbody"></div></div>
<div class="confirm" id="cfm"><div class="confirm-box" id="cfbox"></div></div>
<div class="toast" id="tst"></div>

<script>
const Q=s=>document.querySelector(s),QA=s=>document.querySelectorAll(s);
const api=async(u,o={})=>{const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.statusText);return r.json()};
const H=s=>{const d=document.createElement('div');d.textContent=s||'';return d.innerHTML};
const TL={claude:'b-cl',cursor:'b-cu',codex:'b-co',antigravity:'b-an',hermes:'b-he',opencode:'b-op',copilot:'b-cp',agent:'b-ag'};
const tc=t=>TL[t]||'b-cp';
const PC=['cy','pk','pu','gr'];
const PCOL=['cyan','pink','purple','green','yellow','orange','muted','purple'];

setInterval(()=>{Q('#clk').textContent=new Date().toTimeString().slice(0,8)},1000);
Q('#clk').textContent=new Date().toTimeString().slice(0,8);

function toast(m,er){const t=Q('#tst');t.textContent=m;t.className='toast on'+(er?' er':'');setTimeout(()=>t.className='toast',4000)}
function modal(h){Q('#mbody').innerHTML=h;Q('#mov').classList.add('on')}
function closeModal(){Q('#mov').classList.remove('on')}
Q('#mov').onclick=e=>{if(e.target===e.currentTarget)closeModal()};

function confirm(msg,btnLabel){
  const label=btnLabel||'Delete';
  return new Promise(res=>{
    Q('#cfbox').innerHTML='<div class="mt" style="margin-bottom:.75rem;color:var(--red)">Confirm</div><div style="font-size:.8rem;margin-bottom:1rem">'+msg+'</div><div style="display:flex;gap:.4rem;justify-content:flex-end"><button class="btn" onclick="Q(\'#cfm\').classList.remove(\'on\');window._cfmRes(false)">Cancel</button><button class="btn btn-d" onclick="Q(\'#cfm\').classList.remove(\'on\');window._cfmRes(true)">'+label+'</button></div>';
    Q('#cfm').classList.add('on');window._cfmRes=res;
  })
}

const gt=()=>JSON.parse(localStorage.getItem('ch_tasks')||'[]');
const st=t=>{localStorage.setItem('ch_tasks',JSON.stringify(t));utc()};
const utc=()=>{const el=Q('#tc');if(el)el.textContent=gt().filter(t=>!t.done).length};
const fmtSize=b=>b<1024?b+'B':b<1048576?(b/1024).toFixed(1)+'KB':(b/1048576).toFixed(1)+'MB';
const fmtDate=s=>{if(!s)return'—';const d=new Date(s);return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+d.toTimeString().slice(0,5)};

let cur='dashboard';let curArgs=[];let unsaved=false;
window.addEventListener('beforeunload',e=>{if(unsaved){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();const b=Q('#saveBtn');if(b)b.click()}
  if(e.key==='Escape'){if(Q('#cfm').classList.contains('on'))Q('#cfm').classList.remove('on');else closeModal()}
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();Q('#gs').focus()}
  if((e.ctrlKey||e.metaKey)&&e.key==='n'){e.preventDefault();newSessionModal()}
});

const NAV=[
  {s:'dashboard',i:'⚡',l:'Dashboard'},{s:'tasks',i:'🎯',l:'Tasks',b:true},{s:'scratch',i:'📝',l:'Scratch Pad'},null,
  {h:'AI History Vault'},{s:'sessions',i:'💬',l:'Sessions',b:true},{s:'projects',i:'📁',l:'Projects'},{s:'tool-notes',i:'🔧',l:'Tool Notes'},null,
  {h:'AI-OS Vault'},{s:'skills',i:'🧠',l:'Skills'},{s:'daily-logs',i:'📅',l:'Daily Logs'},{s:'learning',i:'📚',l:'Learning'},{s:'conversations',i:'🤖',l:'Conversations'},null,
  {h:'Views'},{s:'timeline',i:'📅',l:'Timeline'},{s:'backups',i:'💾',l:'Backups'},null,
  {h:'Sync'},{s:'persistent-memory',i:'💾',l:'Memory'},{s:'latest-context',i:'🔄',l:'Context'},{s:'recent',i:'📊',l:'Recent'},null,
  {h:'System'},{s:'configs',i:'⚙️',l:'Configs'},
];

function buildNav(){
  Q('#nav').innerHTML=NAV.map(n=>{
    if(!n)return'';
    if(n.h)return'<div class="ns">'+n.h+'</div>';
    const id=n.b?(n.s==='tasks'?' id="tc"':n.s==='sessions'?' id="sc"':''):'';
    return'<div class="ni'+(cur===n.s?' on':'')+'" data-p="'+n.s+'"><span class="i">'+n.i+'</span>'+n.l+(n.b?'<span class="nb"'+id+'>0</span>':'')+'</div>';
  }).join('');
  QA('.ni').forEach(n=>n.onclick=()=>go(n.dataset.p));
  utc();
}

function toggleSidebar(){Q('#nav').classList.toggle('open')}
function loadingHTML(msg){return'<div style="text-align:center;padding:2rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:.5rem"><div class="spinner"></div><div style="font-size:.75rem;font-family:var(--d);letter-spacing:1px">'+(msg||'LOADING...')+'</div></div>'}

let healthOK=false;
async function checkHealth(){const dot=Q('#healthDot');dot.className='health-dot loading';dot.title='Checking vault health...';try{await api('/api/health');dot.className='health-dot ok';dot.title='Vault healthy';healthOK=true}catch(e){dot.className='health-dot';dot.title='Vault offline: '+e.message;healthOK=false}}

function highlightMatch(text,query){if(!query||!text)return H(text);const escaped=query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const regex=new RegExp('('+escaped+')','gi');return H(text).replace(regex,'<mark class="hl">$1</mark>')}

function animateCounters(){QA('.sv[data-target]').forEach(el=>{const target=parseInt(el.dataset.target)||0;let current=0;const step=Math.max(1,Math.floor(target/30));const timer=setInterval(()=>{current+=step;if(current>=target){current=target;clearInterval(timer)}el.textContent=current},30)})}

const P={};

P.dashboard=async()=>{const s=await api('/api/stats');const scEl=Q('#sc');if(scEl)scEl.textContent=s.totalSessions;setTimeout(animateCounters,100);
return'<div class="fi2"><div class="glow-line"></div><div class="sg stagger-in"><div class="sc cy"><div class="sl">Sessions</div><div class="sv" data-target="'+s.totalSessions+'">0</div></div><div class="sc pk"><div class="sl">Skills</div><div class="sv" data-target="'+s.skills.length+'">0</div></div><div class="sc pu"><div class="sl">Projects</div><div class="sv" data-target="'+s.projects+'">0</div></div><div class="sc gr"><div class="sl">Daily Logs</div><div class="sv" data-target="'+s.dailyLogs+'">0</div></div><div class="sc yl"><div class="sl">Tool Notes</div><div class="sv" data-target="'+s.toolNotes+'">0</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1.25rem" class="stagger-in"><div class="card"><div class="ch"><div class="ct">Sessions by Tool</div></div>'+Object.entries(s.sessionCounts).map(([t,n],i)=>'<div class="sr2"><span class="badge '+tc(t)+'">'+t+'</span><div class="pb"><div class="pf" style="width:'+(s.totalSessions?n/s.totalSessions*100:0)+'%;background:linear-gradient(90deg,var(--'+PCOL[i]+'),transparent)"></div></div><small>'+n+'</small></div>').join('')+'</div><div class="card"><div class="ch"><div class="ct">Skills Mastery</div></div>'+s.skills.map((sk,i)=>'<div class="sr2"><b>'+sk.name+'</b><span class="badge b-he">L'+sk.level+'</span><div class="pb"><div class="pf" style="width:'+sk.progress+'%;background:linear-gradient(90deg,var(--'+PC[i%4]+'),transparent)"></div></div><small>'+sk.progress+'%</small></div>').join('')+'</div></div><div class="card glass-card" style="margin-bottom:1.25rem"><div class="ch"><div class="ct">Quick Actions</div></div><div class="ag stagger-in"><div class="ab" onclick="newSessionModal()"><span>➕</span><small>New Session</small></div><div class="ab" onclick="newProjectModal()"><span>🚀</span><small>New Project</small></div><div class="ab" onclick="newLogModal()"><span>📅</span><small>New Log</small></div><div class="ab" onclick="go(\'sessions\')"><span>💬</span><small>Sessions</small></div><div class="ab" onclick="go(\'tasks\')"><span>🎯</span><small>Tasks</small></div><div class="ab" onclick="go(\'skills\')"><span>🧠</span><small>Skills</small></div><div class="ab" onclick="go(\'scratch\')"><span>📝</span><small>Scratch</small></div><div class="ab" onclick="go(\'recent\')"><span>📊</span><small>Recent</small></div><div class="ab" onclick="go(\'timeline\')"><span>📅</span><small>Timeline</small></div><div class="ab" onclick="go(\'backups\')"><span>💾</span><small>Backups</small></div></div></div><div class="card"><div class="ch"><div class="ct">Keyboard Shortcuts</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:.3rem;font-size:.7rem;color:var(--muted)"><div><span class="kbd">Ctrl+S</span> Save in editor</div><div><span class="kbd">Ctrl+N</span> New session</div><div><span class="kbd">Esc</span> Close modal</div><div><span class="kbd">/</span> Focus search</div></div></div></div>'};

P.tasks=()=>{const tasks=gt(),pend=tasks.filter(t=>!t.done),done=tasks.filter(t=>t.done);
return'<div class="fi2"><div class="glow-line"></div><div class="ct" style="margin-bottom:.75rem">🎯 Task Manager</div><div style="display:flex;gap:.5rem;margin-bottom:1rem"><button class="btn btn-p" onclick="addTaskModal()">+ Add Task</button><button class="btn btn-d" onclick="clearDone()">Clear Done</button></div><div class="card glass-card" style="margin-bottom:.75rem"><div class="ch"><div class="ct">In Progress ('+pend.length+')</div></div>'+(pend.length===0?'<div style="color:var(--muted);font-size:.75rem">No pending tasks.</div>':'')+pend.map(t=>'<div class="sr2"><input type="checkbox" onchange="togTask(\''+t.id+'\')" style="accent-color:var(--cyan)"><div style="flex:1"><div style="font-size:.8rem">'+H(t.text)+'</div><div style="font-size:.6rem;color:var(--muted);font-family:var(--mono)">'+(t.category||'General')+' • '+(t.created||'')+'</div></div><span class="badge '+(t.priority==='high'?'b-cl':t.priority==='medium'?'b-an':'b-cp')+'">'+(t.priority||'low')+'</span><button class="btn btn-d btn-s" onclick="delTask(\''+t.id+'\')">✕</button></div>').join('')+'</div><div class="card glass-card"><div class="ch"><div class="ct">Completed ('+done.length+')</div></div>'+done.map(t=>'<div class="sr2" style="opacity:.5"><input type="checkbox" checked onchange="togTask(\''+t.id+'\')" style="accent-color:var(--cyan)"><div style="flex:1;font-size:.75rem;text-decoration:line-through;color:var(--muted)">'+H(t.text)+'</div><button class="btn btn-d btn-s" onclick="delTask(\''+t.id+'\')">✕</button></div>').join('')+'</div></div>'};

P.scratch=async()=>{const d=await api('/api/scratch');
return'<div class="fi2"><div class="glow-line"></div><div class="ch"><div class="ct">📝 Scratch Pad</div><div style="display:flex;gap:.3rem"><span style="font-size:.65rem;color:var(--muted);font-family:var(--mono)" id="scratchStatus">Auto-saves</span><button class="btn btn-p" id="scratchSave">Save</button></div></div><textarea id="scratchArea" class="ft" style="min-height:500px;font-size:.8rem;width:100%">'+H(d.raw)+'</textarea></div>'};

P.sessions=async(tool='all')=>{const ss=await api('/api/sessions?tool='+tool);
return'<div class="fi2"><div class="glow-line"></div><div class="ch"><div class="ct">💬 Sessions ('+ss.length+')</div><button class="btn btn-g btn-s" onclick="exportSessions()">⬇ Export JSON</button></div><div style="display:flex;gap:.5rem;margin-bottom:1rem"><button class="btn btn-p" onclick="newSessionModal()">+ New Session</button></div><div class="tabs">'+['all','claude','cursor','codex','antigravity','hermes','opencode','copilot'].map(t=>'<div class="tab'+(t===tool?' on':'')+'" onclick="go(\'sessions\',\''+t+'\')">'+t+'</div>').join('')+'</div><div class="card glass-card"><table><thead><tr><th>Date</th><th>Tool</th><th>Title</th><th>Size</th><th></th></tr></thead><tbody>'+ss.map(s=>'<tr><td style="font-family:var(--mono);font-size:.65rem;white-space:nowrap">'+fmtDate(s.modified)+'</td><td><span class="badge '+tc(s.tool)+'">'+s.tool+'</span></td><td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+H(s.title)+'</td><td style="font-family:var(--mono);font-size:.6rem;color:var(--muted)">'+fmtSize(s.size)+'</td><td style="white-space:nowrap"><button class="btn btn-s" data-path="'+H(s.path)+'" data-vault="history" onclick="viewItem(this.dataset.path,this.dataset.vault)">View</button> <button class="btn btn-s" data-path="'+H(s.path)+'" data-vault="history" onclick="editItem(this.dataset.path,this.dataset.vault)">Edit</button> <button class="btn btn-s btn-d" data-path="'+H(s.path)+'" data-vault="history" onclick="deleteItem(this.dataset.path,this.dataset.vault,\'sessions\')">Del</button></td></tr>').join('')+'</tbody></table></div></div>'};

window.exportSessions=async()=>{try{const ss=await api('/api/sessions?tool=all');const blob=new Blob([JSON.stringify(ss,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='sessions-export.json';a.click();URL.revokeObjectURL(url);toast('Sessions exported as JSON')}catch(e){toast('Export failed: '+e.message,true)}};

P.projects=async()=>{const ps=await api('/api/projects');
return'<div class="fi2"><div class="glow-line"></div><div class="ct" style="margin-bottom:.75rem">📁 Projects ('+ps.length+')</div><button class="btn btn-p" onclick="newProjectModal()" style="margin-bottom:.75rem">+ New Project</button><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.75rem" class="stagger-in">'+ps.map(p=>'<div class="card glass-card"><div class="ch"><div class="ct">'+H(p.name.replace('.md',''))+'</div><span class="badge b-he">'+(p.meta?.status||'Planning')+'</span></div><div style="font-size:.7rem;color:var(--muted)">Domain: '+(p.meta?.domain||'TBD')+'</div><div style="font-size:.7rem;color:var(--muted)">Tech: '+(Array.isArray(p.meta?.tech)?p.meta.tech.join(', '):(p.meta?.tech||'TBD'))+'</div><div style="margin-top:.5rem;display:flex;gap:.3rem"><button class="btn btn-s" data-path="'+H(p.path)+'" data-vault="history" onclick="viewItem(this.dataset.path,this.dataset.vault)">View</button><button class="btn btn-s" data-path="'+H(p.path)+'" data-vault="history" onclick="editItem(this.dataset.path,this.dataset.vault)">Edit</button><button class="btn btn-s btn-d" data-path="'+H(p.path)+'" data-vault="history" onclick="deleteItem(this.dataset.path,this.dataset.vault,\'projects\')">Del</button></div></div>').join('')+'</div></div>'};

P.skills=async()=>{const ss=await api('/api/skills');const lvlNames=['','Novice','Beginner','Intermediate','Advanced','Expert','Master'];
return'<div class="fi2"><div class="glow-line"></div><div class="ct" style="margin-bottom:.75rem">🧠 Skills Mastery</div><div class="card glass-card stagger-in">'+ss.map((s,i)=>{const lv=s.meta?.mastery_level||0;return'<div class="sr2"><b>'+s.name+'</b><span class="badge b-he">L'+lv+' '+(lvlNames[lv]||'')+'</span><div class="pb"><div class="pf" style="width:'+(s.meta?.progress||0)+'%;background:linear-gradient(90deg,var(--'+PC[i%4]+'),transparent)"></div></div><small>'+(s.meta?.progress||0)+'%</small><button class="btn btn-s" onclick="editSkillModal(\''+s.name+'\','+lv+','+(s.meta?.progress||0)+',\''+(s.meta?.status||'In Progress')+'\')">Edit</button></div>'}).join('')+'</div></div>'};

P['daily-logs']=async()=>{const ls=await api('/api/daily-logs');
return'<div class="fi2"><div class="glow-line"></div><div class="ct" style="margin-bottom:.75rem">📅 Daily Logs ('+ls.length+')</div><button class="btn btn-p" onclick="newLogModal()" style="margin-bottom:.75rem">+ New Log</button><div class="card glass-card stagger-in">'+(ls.length===0?'<div style="color:var(--muted);font-size:.75rem">No logs yet.</div>':'')+ls.map(l=>'<div class="sr2"><span>📝</span><div style="flex:1"><div style="font-size:.8rem">'+l.name.replace('.md','')+'</div></div><div style="display:flex;gap:.3rem"><button class="btn btn-s" data-path="'+H(l.path)+'" data-vault="ai-os" onclick="viewItem(this.dataset.path,this.dataset.vault)">View</button><button class="btn btn-s" data-path="'+H(l.path)+'" data-vault="ai-os" onclick="editItem(this.dataset.path,this.dataset.vault)">Edit</button><button class="btn btn-s btn-d" data-path="'+H(l.path)+'" data-vault="ai-os" onclick="deleteItem(this.dataset.path,this.dataset.vault,\'daily-logs\')">Del</button></div></div>').join('')+'</div></div>'};

P['tool-notes']=async()=>{const ns=await api('/api/tool-notes');
return'<div class="fi2"><div class="glow-line"></div><div class="ct" style="margin-bottom:.75rem">🔧 Tool Notes ('+ns.length+')</div><div class="card glass-card stagger-in">'+ns.map(n=>'<div class="sr2"><span>📄</span><div style="flex:1;font-size:.8rem">'+n.name.replace('.md','')+'</div><div style="display:flex;gap:.3rem"><button class="btn btn-s" data-path="'+H(n.path)+'" data-vault="history" onclick="viewItem(this.dataset.path,this.dataset.vault)">View</button><button class="btn btn-s" data-path="'+H(n.path)+'" data-vault="history" onclick="editItem(this.dataset.path,this.dataset.vault)">Edit</button><button class="btn btn-s btn-d" data-path="'+H(n.path)+'" data-vault="history" onclick="deleteItem(this.dataset.path,this.dataset.vault,\'tool-notes\')">Del</button></div></div>').join('')+'</div></div>'};

P.timeline=async()=>{const items=await api('/api/timeline');
return'<div class="fi2"><div class="glow-line"></div><div class="ct" style="margin-bottom:.75rem">📅 Timeline</div><div class="card glass-card stagger-in">'+(items.length===0?'<div style="color:var(--muted);font-size:.75rem">No timeline items.</div>':'')+items.map(it=>'<div class="tl-item"><div class="tl-line" style="position:relative"><div class="tl-dot '+(it.vault||'history')+'"></div></div><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:.4rem;margin-bottom:.2rem"><span class="badge '+(it.vault==='ai-os'?'b-co':'b-cu')+'">'+(it.vault||'history')+'</span><span style="font-size:.65rem;color:var(--muted);font-family:var(--mono)">'+fmtDate(it.modified||it.date)+'</span></div><div style="font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+H(it.name||it.title||it.path)+'</div>'+(it.summary?'<div style="font-size:.7rem;color:var(--muted);margin-top:.15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+H(it.summary)+'</div>':'')+'<div style="margin-top:.3rem"><button class="btn btn-s" data-path="'+H(it.path||'')+'" data-vault="'+H(it.vault||'history')+'" onclick="viewItem(this.dataset.path,this.dataset.vault)">View</button></div></div></div>').join('')+'</div></div>'};

P.backups=async(vaultTab='history')=>{const backups=await api('/api/backups?vault='+vaultTab);
return'<div class="fi2"><div class="glow-line"></div><div class="ct" style="margin-bottom:.75rem">💾 Backups</div><div class="tabs">'+['history','ai-os'].map(v=>'<div class="tab'+(v===vaultTab?' on':'')+'" onclick="go(\'backups\',\''+v+'\')">'+v+'</div>').join('')+'</div><div class="card glass-card stagger-in">'+(backups.length===0?'<div style="color:var(--muted);font-size:.75rem">No backups found.</div>':'')+backups.map(bk=>'<div class="bk-card"><div style="flex:1;min-width:0"><div style="font-size:.8rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+H(bk.name)+'</div><div style="font-size:.65rem;color:var(--muted);font-family:var(--mono);margin-top:.15rem">'+fmtSize(bk.size)+' • '+fmtDate(bk.modified)+'</div></div><button class="btn btn-s" onclick="viewBackup(\''+bk.name.replace(/'/g,"\\'")+'\')">View</button></div>').join('')+'</div></div>'};

window.viewBackup=async(name)=>{try{const d=await api('/api/backup/'+encodeURIComponent(name));modal('<div class="mh"><div class="mt">Backup: '+H(name)+'</div><button class="mx" onclick="closeModal()">✕</button></div><div class="md">'+(d.html||'<div style="color:var(--muted)">'+H(d.raw||d.content||'No content')+'</div>')+'</div>')}catch(e){toast('Failed: '+e.message,true)}};

P.learning=async()=>{const paths=await api('/api/learning-paths');
const pathData=await Promise.all(paths.map(async p=>{try{const d=await api('/api/learning-path/'+encodeURIComponent(p.name.replace('.md','')));return{...p,html:d.html,raw:d.raw}}catch{return{...p,html:'',raw:''}}}));
const enriched=await getEnrichedPaths();
return'<div class="fi2"><div class="glow-line"></div><div class="ct" style="margin-bottom:.75rem">📚 Learning Paths<button class="btn btn-p btn-mini" style="float:right;margin-top:-.15rem" onclick="newLearningModal()">+ Log Session</button></div><div class="tabs" id="lpTabs">'+pathData.map((p,i)=>'<div class="tab'+(i===0?' on':'')+'" onclick="showLP('+i+')">'+p.name.replace('.md','').replace(' Mastery Path','')+'</div>').join('')+'</div><div id="lpContent" class="stagger-in">'+pathData.map((p,i)=>{
const slug=p.name.replace('.md','');const extra=enriched[slug]||{};
return'<div class="lp-page" data-idx="'+i+'" style="'+(i!==0?'display:none':'')+'"><div class="lp-card glass-card"><div class="ch"><div class="ct">'+H(slug)+'</div>'+(extra.status?'<span class="badge b-he">'+extra.status+'</span>':'')+'</div>'+(extra.duration?'<div style="font-size:.7rem;color:var(--muted);margin-bottom:.5rem">⏱ '+extra.duration+'</div>':'')+(extra.overview?'<div style="font-size:.75rem;color:var(--text);margin-bottom:.75rem;line-height:1.6">'+extra.overview+'</div>':'')+(extra.phases?extra.phases.map(ph=>'<div class="lp-phase"><div class="lp-phase-title">'+ph.title+'</div><div style="font-size:.7rem;color:#94A3B8;margin-bottom:.3rem">'+ph.description+'</div>'+(ph.topics?'<div style="font-size:.68rem;color:#E0F7FC;margin-bottom:.3rem">'+ph.topics+'</div>':'')+(ph.resources?'<div style="margin-top:.3rem">'+ph.resources.map(r=>'<a class="lp-resource" href="'+r.url+'" target="_blank">'+r.icon+' '+r.label+'</a>').join('')+'</div>':'')+'</div>').join(''):'')+(extra.projects?'<div style="margin-top:.75rem"><div class="lp-phase-title">🛠 Practice Projects</div>'+extra.projects.map(pj=>'<div class="lp-project">🎯 '+pj+'</div>').join('')+'</div>':'')+(extra.courses?'<div style="margin-top:.5rem"><div class="lp-phase-title" style="margin-bottom:.3rem">🎓 Recommended Courses</div>'+extra.courses.map(c=>'<a class="lp-resource" href="'+c.url+'" target="_blank">'+c.icon+' '+c.label+'</a>').join('')+'</div>':'')+'</div><div class="card glass-card" style="margin-top:.75rem"><div class="ch"><div class="ct">Raw Content</div></div><div class="md">'+(p.html||'<div style="color:var(--muted)">No content</div>')+'</div></div></div>'}).join('')+'</div></div>'};

window.showLP=idx=>{QA('.lp-page').forEach((el,i)=>el.style.display=i===idx?'':'none');QA('#lpTabs .tab').forEach((t,i)=>{t.className='tab'+(i===idx?' on':'')})};

// ═══════════════════════════════════════════════════════════════
// PARALLAX MOUSE TRACKING
// ═══════════════════════════════════════════════════════════════
let mouseX=0,mouseY=0;
document.addEventListener('mousemove',e=>{mouseX=e.clientX/window.innerWidth-0.5;mouseY=e.clientY/window.innerHeight-0.5});
function updateParallax(){QA('.ambient-orb').forEach(orb=>{const speed=parseFloat(orb.dataset.speed)||0.02;const x=mouseX*100*speed;const y=mouseY*100*speed;orb.style.transform='translate('+x+'px,'+y+'px)'});requestAnimationFrame(updateParallax)}
updateParallax();

// ═══════════════════════════════════════════════════════════════
// PARTICLE CANVAS
// ═══════════════════════════════════════════════════════════════
(function(){
const canvas=document.createElement('canvas');
canvas.style.cssText='position:fixed;inset:0;z-index:0;pointer-events:none;width:100vw;height:100vh';
document.getElementById('parallax-bg').appendChild(canvas);
const ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
window.addEventListener('resize',resize);resize();
const particles=[];
class Particle{
  constructor(){this.reset()}
  reset(){this.x=Math.random()*W;this.y=Math.random()*H;this.vx=(Math.random()-0.5)*0.8;this.vy=(Math.random()-0.5)*0.8;this.r=Math.random()*1.5+0.5;this.alpha=Math.random()*0.5+0.1;this.color=Math.random()>0.5?'0,243,255':'255,0,127'}
  update(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>W||this.y<0||this.y>H)this.reset()}
  draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle='rgba('+this.color+','+this.alpha+')';ctx.fill()}
}
for(let i=0;i<60;i++)particles.push(new Particle());
function render(){ctx.clearRect(0,0,W,H);particles.forEach((p,i)=>{p.update();p.draw();for(let j=i+1;j<particles.length;j++){const d=Math.hypot(p.x-particles[j].x,p.y-particles[j].y);if(d<150){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle='rgba(0,243,255,'+(0.15-d/1000)+')';ctx.lineWidth=0.5;ctx.stroke()}}});requestAnimationFrame(render)}
render();
})();
