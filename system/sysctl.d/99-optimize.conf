# Hardware-tuned desktop responsiveness — i7-8550U / 32GB RAM / SATA SSD / zram(zstd)
# Swap is fast compressed RAM -> aggressive swapping keeps anon memory compressed
# instead of evasting page cache. Max value 200.
vm.swappiness = 180

# Keep FS metadata/dentry cache resident -> snappier file ops (btrfs benefits)
vm.vfs_cache_pressure = 50

# zram has zero seek cost -> readahead pointless
vm.page-cluster = 0

# Avoid reclaim storms / keep free-memory headroom smooth on 32GB
vm.watermark_boost_factor = 1
vm.watermark_scale_factor = 125

# Writeback pacing for SATA SSD (existing values kept)
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15
vm.dirty_writeback_centisecs = 500
vm.min_free_kbytes = 131072
vm.zone_reclaim_mode = 0

# Dev workload headroom (node_modules, VS Code, Obsidian sync)
net.core.somaxconn = 4096
fs.inotify.max_user_watches = 1048576
