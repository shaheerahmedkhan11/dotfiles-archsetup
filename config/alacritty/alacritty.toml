# ╔═══════════════════════════════════════════════════════════════╗
# ║  Alacritty — Catppuccin Mocha Glassmorphic                  ║
# ╚═══════════════════════════════════════════════════════════════╝

[general]
live_config_reload = true

[terminal.shell]
program = "/usr/bin/fish"
args = ["--login"]

[env]
TERM = "xterm-256color"
EDITOR = "nvim"
COLORTERM = "truecolor"

[window]
padding = { x = 16, y = 12 }
dynamic_padding = true
decorations = "None"
opacity = 0.82
dynamic_title = true
startup_mode = "Windowed"
blur = true

[window.class]
general = "Alacritty"
instance = "Alacritty"

[window.dimensions]
columns = 120
lines = 36

[window.position]
x = 0
y = 0

[scrolling]
history = 100000
multiplier = 5

[font]
size = 13.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.offset]
x = 0
y = 1

[cursor]
style = { shape = "Beam", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "Off" }
blink_interval = 400
unfocused_hollow = true

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[keyboard]
bindings = [
  { key = "Return",   mods = "Control|Shift", action = "ToggleFullscreen" },
  { key = "N",        mods = "Control|Shift", action = "SpawnNewInstance" },
  { key = "Q",        mods = "Control|Shift", action = "Quit" },
  { key = "Plus",     mods = "Control|Shift", action = "IncreaseFontSize" },
  { key = "Minus",    mods = "Control|Shift", action = "DecreaseFontSize" },
  { key = "Key0",     mods = "Control|Shift", action = "ResetFontSize" },
  { key = "C",        mods = "Control|Shift", action = "Copy" },
  { key = "V",        mods = "Control|Shift", action = "Paste" },
  { key = "K",        mods = "Control|Shift", action = "ClearHistory" },
  { key = "PageUp",   mods = "Control|Shift", action = "ScrollPageUp" },
  { key = "PageDown", mods = "Control|Shift", action = "ScrollPageDown" },
  { key = "Home",     mods = "Control|Shift", action = "ScrollToTop" },
  { key = "End",      mods = "Control|Shift", action = "ScrollToBottom" },
  { key = "F",        mods = "Control|Shift", action = "SearchForward" },
  { key = "B",        mods = "Control|Shift", action = "SearchBackward" },
  { key = "Space",    mods = "Control|Shift", action = "ToggleViMode" },
]

# ═══════════════════════════════════════════════════════════
