# ╔═══════════════════════════════════════════════════════════╗
# ║  Kitty Terminal — Catppuccin Mocha Glassmorphic          ║
# ╚═══════════════════════════════════════════════════════════╝

# ── Font ──────────────────────────────────────────────────
font_family         JetBrainsMono Nerd Font
bold_font           JetBrainsMono Nerd Font Bold
italic_font         JetBrainsMono Nerd Font Italic
bold_italic_font    JetBrainsMono Nerd Font Bold Italic
font_size           13.0
modify_font         cell_height 115%
font_features       calt 0
font_features       liga 0

# ── Cursor ────────────────────────────────────────────────
cursor_shape            beam
cursor_blink_interval   0.4
cursor_stop_blinking_after 10.0
cursor_beam_thickness   1.5

# ── Scrollback ────────────────────────────────────────────
scrollback_lines             100000
scrollback_pager_history_size 128
wheel_scroll_multiplier      5

# ── Mouse ─────────────────────────────────────────────────
copy_on_select          clipboard
mouse_hide_wait         3.0
url_style               curly
detect_urls             yes
open_url_with           default
strip_trailing_spaces   smart
box_drawing_scale       0.001, 0.001, 0.001, 1

# ── Window ────────────────────────────────────────────────
window_padding_width        12 16 12 16
hide_window_decorations     yes
confirm_os_window_close     0
initial_window_width        120c
initial_window_height       36c
remember_window_size        yes
single_window_margin_width  -1
window_margin_width         0
resize_in_steps             yes
active_border_color         #cba6f7
inactive_border_color       #313244
inactive_text_alpha         0.7

# ── Tab Bar ───────────────────────────────────────────────
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
tab_bar_align           left
tab_bar_margin_width    6
active_tab_font_style   bold
inactive_tab_font_style normal
tab_title_template      "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title}"
active_tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title}"

# ── Window Layout ─────────────────────────────────────────
enabled_layouts splits,tall,fat,grid,stack

# ── Bell ──────────────────────────────────────────────────
enable_audio_bell       no
visual_bell_duration    0.0
visual_bell_color       none
window_alert_on_bell    yes
bell_on_tab             "* "

# ── Shell Integration ─────────────────────────────────────
shell_integration       enabled
allow_remote_control     yes
listen_on               unix:/tmp/mykitty
shell                   /usr/bin/zsh

# ── Performance ───────────────────────────────────────────
repaint_delay    4
input_delay      1
sync_to_monitor  yes

# ── Background Opacity (Glassmorphic) ─────────────────────
background_opacity         0.78
dynamic_background_opacity yes

# ── Wayland ───────────────────────────────────────────────
wayland_titlebar_color   background
linux_display_server     wayland

# ═══════════════════════════════════════════════════════════
# ── Catppuccin Mocha Theme
# ═══════════════════════════════════════════════════════════

foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc

cursor                  #f5e0dc
cursor_text_color       #1e1e2e

url_color               #89b4fa

active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

mark1_foreground #11111b
mark1_background #89b4fa
mark2_foreground #11111b
mark2_background #f5c2e7
mark3_foreground #11111b
mark3_background #cba6f7

# Normal colors
color0  #1e1e2e
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #cba6f7
color6  #94e2d5
color7  #bac2de

# Bright colors
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #cba6f7
color14 #94e2d5
color15 #a6adc8

# Extended Catppuccin Accents
color16 #fab387
color17 #f5c2e7
color18 #74c7ec
color19 #b4befe

# ═══════════════════════════════════════════════════════════
# ── Keybindings
# ═══════════════════════════════════════════════════════════

map ctrl+equal      change_font_size all +1.0
map ctrl+minus      change_font_size all -1.0
map ctrl+0          change_font_size all 0

map ctrl+shift+t    new_tab_with_cwd
map ctrl+shift+n    new_window_with_cwd

map ctrl+shift+-    launch --location=hsplit --cwd=current
map ctrl+shift+\    launch --location=vsplit --cwd=current
map ctrl+shift+w    close_window

map ctrl+shift+c    copy_to_clipboard
map ctrl+shift+v    paste_from_clipboard

map ctrl+shift+up   scroll_line_up
map ctrl+shift+down scroll_line_down
map ctrl+shift+page_up   scroll_page_up
map ctrl+shift+page_down scroll_page_down

map ctrl+shift+k    clear_terminal_to_prompt
map ctrl+shift+a    select_all_copies_to_clipboard
map ctrl+shift+backspace change_font_size all 0

map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab

map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9

map ctrl+shift+l next_layout
map ctrl+shift+e    open_url_with_hints

map ctrl+shift+home  scroll_home
map ctrl+shift+end   scroll_end

map ctrl+shift+enter toggle_layout stack

map ctrl+alt+.      move_window forward
map ctrl+alt+,      move_window backward

map ctrl+alt+left   resize_window narrower 3
map ctrl+alt+right  resize_window wider 3
map ctrl+alt+up     resize_window taller 3
map ctrl+alt+down   resize_window shorter 3

map ctrl+shift+f    find_url
map ctrl+shift+g    input_unicode_character
