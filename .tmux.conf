# ╔═══════════════════════════════════════════════════════════╗
# ║  Tmux — Exquisite Catppuccin Glassmorphic                ║
# ╚═══════════════════════════════════════════════════════════╝

# ── General ───────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB,xterm-256color:RGB,alacritty:RGB"
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -sg escape-time 0
set -g focus-events on
set -g default-command "${SHELL}"
set -g set-titles on
set -g set-titles-string "#T"
set -g display-panes-time 2000
set -g display-time 2000

# ── Prefix ────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Status Bar (Exquisite Catppuccin Glass) ───────────────
set -g status-position top
set -g status-interval 5
set -g status-style 'bg=#11111b fg=#CDD6F4'
set -g status-left-length 70
set -g status-right-length 90

set -g status-left '#[bg=#89B4FA fg=#11111B bold]  #S #[bg=#11111b fg=#89B4FA] '
set -g status-right '#[fg=#6c7086 bg=#1e1e2e] 󰥔 %H:%M #[bg=#181825 fg=#cba6f7] 󰃭 %d-%b #[bg=#a6e3a1 fg=#11111B bold] %Y '

setw -g window-status-format '#[fg=#6c7086] #I:#W '
setw -g window-status-current-format '#[bg=#74C7EC fg=#11111B bold] #I:#W '
setw -g window-status-separator ''
setw -g window-status-current-separator ''

# ── Pane Borders ──────────────────────────────────────────
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89B4FA'
set -g pane-border-lines heavy
set -g pane-border-status top

# ── Messages ──────────────────────────────────────────────
set -g message-style 'bg=#89B4FA fg=#11111B bold'
set -g message-command-style 'bg=#313244 fg=#CDD6F4'
set -g mode-style 'bg=#89B4FA fg=#11111B bold'

# ── Clock ─────────────────────────────────────────────────
setw -g clock-mode-colour '#89B4FA'
setw -g clock-mode-style 24

# ── Key Bindings ──────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind x kill-pane
bind X kill-window

# ── Navigation ────────────────────────────────────────────
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ── Resize ────────────────────────────────────────────────
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# ── Window Navigation ─────────────────────────────────────
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ── Copy Mode ─────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'

# ── Session Management ────────────────────────────────────
bind S command-prompt -p "New session name:" "new-session -s '%%'"
bind K confirm-before -p "Kill session? (y/n)" kill-session

# ── Smart pane switching with awareness of Vim splits ─────
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# ── Plugins ───────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# ── Plugin Settings ───────────────────────────────────────
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @prefix_highlight_fg '#11111B'
set -g @prefix_highlight_bg '#89B4FA'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=#11111B,bg=#a6e3a1,bold'

# ── Initialize TPM ────────────────────────────────────────
run '~/.tmux/plugins/TPM/tpm'
